[package]
name = "cecvol"
version = "0.2.1"
authors = ["Steven Rhodes <rhodes.steven@gmail.com>"]
license = "MIT"
readme = "README.md"
description = "Control LG TV volume, power, and inputs over LAN"
edition = "2021"
rust-version = "1.87.0"

[dependencies]
aes = "0.8.2"
block-padding = "0.3.2"
cbc = "0.1.2"
clap = { version = "4.6.1", features = ["derive", "env"] }
ecb = { version = "0.1.1", features = ["alloc", "block-padding"] }
env_logger = "0.10.0"
log = "0.4.17"
nix = { version = "0.26.2", features = ["net"] }
pbkdf2 = { version = "0.12.1", features = ["hmac"] }
percent-encoding = "2.2.0"
prometheus = { version = "0.14.0", features = ["process"] }
rand = { version = "0.8.5", features = ["std_rng"] }
tiny_http = "0.12"
serde = { version = "1.0.145", features = ["derive"] }
serde_json = "1.0.86"
serde_urlencoded = "0.7.1"
sha2 = "0.10.6"

[package.metadata.deb]
maintainer-scripts = "debian/"
systemd-units = {}
