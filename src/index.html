<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:image/svg+xml,<svg width='80pt' height='80pt' version='1.0' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'>
            <g transform='translate(0 80) scale(.1 -.1)' fill='purple'>
                <path d='m50 565v-205h350 350v205 205h-350-350v-205zm630 0v-135h-280-280v135 135h280 280v-135z' />
                <path d='m170 295v-35h230 230v35 35h-230-230v-35z' />
                <path d='m520 20v70h-70v70h70v70h70v-70h70v-70h-70v-70z' />
                <path d='m130 115v-35h105 105v35 35h-105-105v-35z' />
            </g>
        </svg>" type="image/svg+xml" />
    <title>CECvol</title>
    <link rel="stylesheet" href="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="manifest" href="/manifest.json">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 12px 16px;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 8px 0 16px;
        }

        h1 {
            text-align: center;
            margin: 0;
            font-size: clamp(1.5rem, 3.5dvh, 2rem);
        }

        .power-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid #d0d0d0;
            background: #f5f5f5;
            color: #555;
            font-family: Roboto, sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
        }

        .power-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #9e9e9e;
        }

        .power-badge.on {
            background: #e8f5e9;
            border-color: #a5d6a7;
            color: #1b5e20;
        }

        .power-badge.on .dot {
            background: #2e7d32;
        }

        .power-badge.off {
            background: #f5f5f5;
            border-color: #d0d0d0;
            color: #616161;
        }

        .power-badge.off .dot {
            background: #9e9e9e;
        }

        .remote {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: clamp(10px, 1.8dvh, 18px);
        }

        .dpad,
        .volume,
        .inputs,
        .menu,
        .wol {
            display: grid;
            gap: clamp(8px, 1.2dvh, 12px);
        }

        .dpad,
        .volume {
            grid-template-columns: repeat(3, 1fr);
        }

        .inputs,
        .menu {
            grid-template-columns: repeat(2, 1fr);
        }

        .wol {
            grid-template-columns: 1fr;
        }

        .volume-slider-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 2px 4px;
        }

        .volume-slider-row input[type="range"] {
            flex: 1;
            height: 32px;
            accent-color: #6200ee;
            cursor: pointer;
            touch-action: manipulation;
        }

        .volume-value {
            min-width: 2.5ch;
            text-align: right;
            font-family: Roboto, sans-serif;
            font-size: 1.1rem;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        .remote .mdc-button {
            width: 100%;
            height: clamp(46px, 7.2dvh, 62px);
            font-size: clamp(1rem, 2.2dvh, 1.2rem);
            border-radius: 10px;
            touch-action: manipulation;
        }

        .remote .mdc-button.muted {
            background-color: #d32f2f;
            color: #fff;
        }

        .remote .dpad .mdc-button {
            height: clamp(54px, 9dvh, 78px);
        }

        .remote .material-icons {
            font-size: clamp(26px, 3.8dvh, 34px);
        }

        .status-row {
            text-align: center;
            margin: 8px 0 0;
        }

        #status {
            padding: 10px;
            visibility: hidden;
        }
    </style>
    <script>
        function newRequestId() {
            const id = (typeof crypto !== 'undefined' && crypto.randomUUID)
                ? crypto.randomUUID().slice(0, 8)
                : Math.random().toString(36).slice(2, 10);
            return 'web-' + id;
        }
        function postFulfillment(input) {
            return fetch('/fulfillment', {
                method: 'POST',
                mode: 'same-origin',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    'requestId': newRequestId(),
                    'inputs': [input]
                })
            }).then(response => response.json());
        }
        function executeCommand(cmd) {
            return postFulfillment({
                'intent': 'action.devices.EXECUTE',
                'payload': {
                    'commands': [{
                        'devices': [{
                            'id': '1'
                        }],
                        'execution': [cmd]
                    }]
                }
            })
                .then(data => {
                    console.log(data);
                    document.getElementById("status").style.visibility = "hidden";
                    const cmdResult = data && data.payload && data.payload.commands && data.payload.commands[0];
                    if (cmdResult && cmdResult.status === 'SUCCESS' && cmdResult.states) {
                        applyDeviceState(cmdResult.states);
                    }
                    return data;
                })
                .catch(e => {
                    console.log(e);
                    document.getElementById("status").textContent = e;
                    document.getElementById("status").style.visibility = "visible";
                });
        }
        let currentMuted = false;
        function updateMuteUI(muted) {
            currentMuted = Boolean(muted);
            const btn = document.getElementById('mute-btn');
            if (!btn) return;
            btn.classList.toggle('muted', currentMuted);
            btn.setAttribute('aria-pressed', currentMuted ? 'true' : 'false');
        }
        function applyDeviceState(dev) {
            if (!dev) return;
            if (typeof dev.on === 'boolean') {
                updatePowerUI(dev.on);
            }
            if (dev.on === false) {
                updateVolumeUI(null);
                updateMuteUI(false);
            } else {
                if (typeof dev.currentVolume === 'number') {
                    updateVolumeUI(dev.currentVolume);
                }
                if (typeof dev.isMuted === 'boolean') {
                    updateMuteUI(dev.isMuted);
                }
            }
        }
        function updatePowerUI(on) {
            const badge = document.getElementById('power-status');
            const label = document.getElementById('power-label');
            badge.classList.remove('on', 'off');
            if (on === true) {
                badge.classList.add('on');
                label.textContent = 'On';
            } else if (on === false) {
                badge.classList.add('off');
                label.textContent = 'Off';
            } else {
                label.textContent = '...';
            }
        }
        // Non-linear position mapping. The slider's 0-30 volume range is
        // stretched across 70% of the track, giving the common 5-30 range
        // more room (and finer granularity) than the rest of the scale.
        const VOL_BREAK_VOLUME = 30;
        const VOL_BREAK_POSITION = 0.7;
        function positionToVolume(p) {
            if (p <= VOL_BREAK_POSITION) {
                return Math.round(VOL_BREAK_VOLUME * p / VOL_BREAK_POSITION);
            }
            return Math.round(VOL_BREAK_VOLUME + (100 - VOL_BREAK_VOLUME) * (p - VOL_BREAK_POSITION) / (1 - VOL_BREAK_POSITION));
        }
        function volumeToPosition(v) {
            if (v <= VOL_BREAK_VOLUME) {
                return v / VOL_BREAK_VOLUME * VOL_BREAK_POSITION;
            }
            return VOL_BREAK_POSITION + (v - VOL_BREAK_VOLUME) / (100 - VOL_BREAK_VOLUME) * (1 - VOL_BREAK_POSITION);
        }
        function volumeSliderKey(e) {
            const delta = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
            if (delta === undefined) return;
            e.preventDefault();
            e.stopPropagation();
            const slider = document.getElementById('volume-slider');
            const next = Math.min(100, Math.max(0, positionToVolume(slider.value / 1000) + delta));
            setVolume(next);
        }
        function updateVolumeUI(level) {
            const slider = document.getElementById('volume-slider');
            const label = document.getElementById('volume-value');
            if (typeof level === 'number' && !Number.isNaN(level)) {
                slider.value = Math.round(volumeToPosition(level) * 1000);
                label.textContent = level;
            } else {
                label.textContent = '--';
            }
        }
        let pendingPowerRefreshes = [];
        function clearPendingPowerRefreshes() {
            for (const id of pendingPowerRefreshes) {
                clearTimeout(id);
            }
            pendingPowerRefreshes = [];
        }
        function refreshState() {
            postFulfillment({
                'intent': 'action.devices.QUERY',
                'payload': {
                    'devices': [{
                        'id': '1'
                    }]
                }
            })
                .then(data => {
                    const dev = data && data.payload && data.payload.devices && data.payload.devices['1'];
                    applyDeviceState(dev);
                })
                .catch(e => {
                    console.log(e);
                });
        }
        function sendVol(level) {
            executeCommand({
                'command': 'action.devices.commands.volumeRelative',
                'params': {
                    'relativeSteps': level
                }
            });
        }
        function setVolume(level) {
            const vol = parseInt(level, 10);
            updateVolumeUI(vol);
            executeCommand({
                'command': 'action.devices.commands.setVolume',
                'params': {
                    'volumeLevel': vol
                }
            });
        }
        function toggleMute() {
            executeCommand({
                'command': 'action.devices.commands.mute',
                'params': {
                    'mute': !currentMuted
                }
            });
        }
        function wol() {
            executeCommand({
                'command': 'action.devices.commands.wol'
            })
        }
        function playPause() {
            executeCommand({
                'command': 'action.devices.commands.mediaPause'
            })
        }
        function setInput(newInput) {
            executeCommand({
                'command': 'action.devices.commands.SetInput',
                'params': {
                    'newInput': newInput
                }
            })
        }
        function onOff(on) {
            clearPendingPowerRefreshes();
            executeCommand({
                'command': 'action.devices.commands.OnOff',
                'params': {
                    'on': on
                }
            }).then(() => {
                const delays = on ? [2500, 6000] : [1500, 4000];
                pendingPowerRefreshes = delays.map(ms => setTimeout(refreshState, ms));
            });
        }
        function sendKey(key) {
            executeCommand({
                'command': 'action.devices.commands.sendKey',
                'params': {
                    'key': key
                }
            })
        }
        document.onkeydown = function (e) {
            e = e || window.event;
            if (e.keyCode == '38') {
                sendVol(1) // up key
            }
            else if (e.keyCode == '40') {
                sendVol(-1) // down key
            }
        }
        window.addEventListener('DOMContentLoaded', refreshState);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                refreshState();
            }
        });
    </script>
</head>

<body>
    <div class="header">
        <h1>TV Control</h1>
        <button id="power-status" class="power-badge" type="button" onclick="refreshState()" title="Click to refresh TV status">
            <span class="dot"></span>
            <span id="power-label">...</span>
        </button>
    </div>
    <div class="remote">
        <div class="dpad">
            <button class="mdc-button mdc-button--raised" onclick="onOff(false)">
                <span class="mdc-button__ripple"></span>
                <i class="material-icons">power_off</i>
            </button>
            <button class="mdc-button mdc-button--raised" onclick="sendKey('up')">
                <span class="mdc-button__ripple"></span>
                <i class="material-icons">keyboard_arrow_up</i>
            </button>
            <button class="mdc-button mdc-button--raised" onclick="onOff(true)">
                <span class="mdc-button__ripple"></span>
                <i class="material-icons">power</i>
            </button>
            <button class="mdc-button mdc-button--raised" onclick="sendKey('left')">
                <span class="mdc-button__ripple"></span>
                <i class="material-icons">keyboard_arrow_left</i>
            </button>
            <button class="mdc-button mdc-button--raised" onclick="sendKey('ok')">
                <span class="mdc-button__ripple"></span>
                OK
            </button>
            <button class="mdc-button mdc-button--raised" onclick="sendKey('right')">
                <span class="mdc-button__ripple"></span>
                <i class="material-icons">keyboard_arrow_right</i>
            </button>
            <button class="mdc-button mdc-button--raised" onclick="sendKey('back')">
                <span class="mdc-button__ripple"></span>
                <i class="material-icons">arrow_back</i>
            </button>
            <button class="mdc-button mdc-button--raised" onclick="sendKey('down')">
                <span class="mdc-button__ripple"></span>
                <i class="material-icons">keyboard_arrow_down</i>
            </button>
            <button class="mdc-button mdc-button--raised" onclick="playPause()" aria-label="Play / Pause">
                <span class="mdc-button__ripple"></span>
                <i class="material-icons">play_arrow</i><i class="material-icons">pause</i>
            </button>
        </div>
        <div class="volume">
            <button id="mute-btn" class="mdc-button mdc-button--raised" onclick="toggleMute()" aria-label="Mute" aria-pressed="false">
                <span class="mdc-button__ripple"></span>
                <i class="material-icons">volume_off</i>
            </button>
            <button class="mdc-button mdc-button--raised" onclick="sendVol(-1)">
                <span class="mdc-button__ripple"></span>
                <i class="material-icons">volume_down</i>
            </button>
            <button class="mdc-button mdc-button--raised" onclick="sendVol(1)">
                <span class="mdc-button__ripple"></span>
                <i class="material-icons">volume_up</i>
            </button>
        </div>
        <div class="volume-slider-row">
            <input id="volume-slider" type="range" min="0" max="1000" step="1" value="0"
                list="volume-ticks"
                oninput="document.getElementById('volume-value').textContent = positionToVolume(this.value / 1000)"
                onchange="setVolume(positionToVolume(this.value / 1000))"
                onkeydown="volumeSliderKey(event)"
                aria-label="Volume">
            <datalist id="volume-ticks">
                <option value="117">5</option>
                <option value="233">10</option>
                <option value="467">20</option>
                <option value="700">30</option>
            </datalist>
            <output id="volume-value" class="volume-value" for="volume-slider">--</output>
        </div>
        <div class="inputs">
            <button class="mdc-button mdc-button--raised" onclick="setInput('1')">
                <span class="mdc-button__ripple"></span>
                hdmi1
            </button>
            <button class="mdc-button mdc-button--raised" onclick="setInput('2')">
                <span class="mdc-button__ripple"></span>
                hdmi2
            </button>
            <button class="mdc-button mdc-button--raised" onclick="setInput('3')">
                <span class="mdc-button__ripple"></span>
                hdmi3
            </button>
            <button class="mdc-button mdc-button--raised" onclick="setInput('4')">
                <span class="mdc-button__ripple"></span>
                hdmi4
            </button>
        </div>
        <div class="wol">
            <button class="mdc-button mdc-button--raised" onclick="wol()">
                <span class="mdc-button__ripple"></span>
                <i class="material-icons">transcribe</i>&nbsp;Wake Serpens
            </button>
        </div>
        <div class="menu">
            <button class="mdc-button mdc-button--raised" onclick="sendKey('home')" aria-label="Home">
                <span class="mdc-button__ripple"></span>
                <i class="material-icons">home</i>
            </button>
            <button class="mdc-button mdc-button--raised" onclick="sendKey('settingmenu')" aria-label="Settings">
                <span class="mdc-button__ripple"></span>
                <i class="material-icons">settings</i>
            </button>
        </div>
    </div>
    <p class="status-row"><span id="status" class="mdc-elevation--z2">abc</span></p>
</body>

</html>
